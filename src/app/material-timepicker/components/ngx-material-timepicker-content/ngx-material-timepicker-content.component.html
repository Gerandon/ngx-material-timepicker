@if (appendToInput) {
  <div [ngxAppendToInput]="inputElement">
    <!--suppress HtmlUnknownAttribute -->
    <ng-container *ngTemplateOutlet="timepickerOutlet"></ng-container>
  </div>
} @else {
  <!--suppress HtmlUnknownAttribute -->
  <ng-container *ngTemplateOutlet="timepickerOutlet"></ng-container>
}


<ng-template #timepickerOutlet>
  <ng-content></ng-content>
</ng-template>
